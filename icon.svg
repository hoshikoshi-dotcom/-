<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#1f4d3a"/>
  <!-- 三脚レベル風 -->
  <g stroke="#2ea872" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 三脚 -->
    <line x1="256" y1="270" x2="160" y2="430" stroke-width="14"/>
    <line x1="256" y1="270" x2="352" y2="430" stroke-width="14"/>
    <line x1="256" y1="270" x2="256" y2="430" stroke-width="14"/>
    <!-- 望遠鏡本体 -->
    <rect x="160" y="200" width="180" height="60" rx="14" fill="#2ea872" stroke="#2ea872"/>
    <circle cx="346" cy="230" r="22" fill="#1f4d3a" stroke="#2ea872" stroke-width="6"/>
    <!-- スタッフ -->
    <rect x="410" y="120" width="28" height="290" fill="#e8e8e8" stroke="#1f4d3a" stroke-width="4"/>
    <line x1="410" y1="160" x2="438" y2="160" stroke="#1f4d3a" stroke-width="4"/>
    <line x1="410" y1="200" x2="438" y2="200" stroke="#1f4d3a" stroke-width="4"/>
    <line x1="410" y1="240" x2="438" y2="240" stroke="#1f4d3a" stroke-width="4"/>
    <line x1="410" y1="280" x2="438" y2="280" stroke="#1f4d3a" stroke-width="4"/>
    <line x1="410" y1="320" x2="438" y2="320" stroke="#1f4d3a" stroke-width="4"/>
    <line x1="410" y1="360" x2="438" y2="360" stroke="#1f4d3a" stroke-width="4"/>
  </g>
  <!-- マイクアイコン (音声入力対応) -->
  <g transform="translate(74,74)">
    <circle cx="40" cy="40" r="38" fill="#2ea872"/>
    <rect x="32" y="20" width="16" height="28" rx="8" fill="#fff"/>
    <path d="M22 42 a18 18 0 0 0 36 0" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
    <line x1="40" y1="58" x2="40" y2="64" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
